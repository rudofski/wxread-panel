name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build
        env:
          # 可选密码门：在仓库 Actions Secrets 配置 PANEL_PASSWORD_HASH
          # （=密码的 SHA-256 hex，生成命令见 README）后自动启用；未配置则不启用
          VITE_PANEL_PASSWORD_HASH: ${{ secrets.PANEL_PASSWORD_HASH }}

      - name: Run unit tests
        run: npm run test:unit

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
